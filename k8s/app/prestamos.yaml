apiVersion: apps/v1
kind: Deployment
metadata:
  name: prestamos-service
  namespace: biblioteca
  labels:
    app: prestamos-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prestamos-service
  template:
    metadata:
      labels:
        app: prestamos-service
    spec:
      containers:
        - name: prestamos-service
          image: prestamos-service:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: LIBROS_URL
              value: "http://libros-service.biblioteca.svc.cluster.local:8081"
            - name: LIBROS_TIMEOUT_MS
              value: "2000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prestamos-service
  namespace: biblioteca
  labels:
    app: prestamos-service
spec:
  type: NodePort
  selector:
    app: prestamos-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
