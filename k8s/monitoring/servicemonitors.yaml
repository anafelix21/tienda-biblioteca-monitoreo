apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: libros-service
  namespace: biblioteca
  labels:
    app: libros-service
spec:
  selector:
    matchLabels:
      app: libros-service
  namespaceSelector:
    matchNames:
      - biblioteca
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prestamos-service
  namespace: biblioteca
  labels:
    app: prestamos-service
spec:
  selector:
    matchLabels:
      app: prestamos-service
  namespaceSelector:
    matchNames:
      - biblioteca
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
